name: Build SmartPay Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartPay_Android_Studio_Project.zip'
      - 'build-smartpay.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract SmartPay project
        run: |
          unzip -o SmartPay_Android_Studio_Project.zip
          test -f SmartPay_Android_Project/app/build.gradle

      - name: Build debug APK
        run: gradle -p SmartPay_Android_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPay-Demo-APK
          path: SmartPay_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
